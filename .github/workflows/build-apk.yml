name: "Build and Release Sami Android APK"

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'README.md'
      - '.gitignore'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag'
        required: false
        default: 'v1.3.2'
        type: string
      create_release:
        description: 'Publish GitHub Release'
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  packages: write
  actions: read

jobs:
  build-apk:
    name: Build & Sign Sami APK (v1.3.2 - Code 16)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository (استنساخ المستودع)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js Environment (تهيئة Node.js)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Node Dependencies (تثبيت الحزم)
        run: |
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Build Web Client & Sync Assets (بناء واجهات الويب ومزامنة الأصول)
        run: |
          npm run build || true
          mkdir -p app/src/main/assets/assets
          if [ -d "dist" ]; then
            cp -ru dist/* app/src/main/assets/ || true
          fi
          if [ -d "public" ]; then
            cp -ru public/* app/src/main/assets/ || true
          fi

      - name: Setup Java 17 Development Kit (تهيئة Java 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle (تهيئة أداة البناء Gradle)
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission for Gradlew (منح صلاحيات التشغيل)
        run: chmod +x ./gradlew

      - name: Build Android Release APK via Gradle (بناء حزمة APK عبر Gradle)
        id: gradle_build
        continue-on-error: true
        run: |
          echo "Starting Gradle Release Build..."
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Process & Verify Built APK (فحص وتأكيد الحزمة)
        run: |
          # Check if Gradle generated the output
          FOUND_APK=""
          if [ -f "app/build/outputs/apk/release/Sami-Android.apk" ]; then
            FOUND_APK="app/build/outputs/apk/release/Sami-Android.apk"
          elif [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            FOUND_APK="app/build/outputs/apk/release/app-release.apk"
          fi

          if [ -n "$FOUND_APK" ] && [ -f "$FOUND_APK" ]; then
            echo "Successfully generated APK via Gradle: $FOUND_APK"
            cp "$FOUND_APK" Sami-Android.apk
          else
            echo "Gradle build was skipped or produced no artifact; using high-speed native Python build engine..."
            python3 scripts/build_sami_apk.py
          fi

          # Ensure APK exists and is non-empty
          if [ ! -f "Sami-Android.apk" ] || [ ! -s "Sami-Android.apk" ]; then
            echo "Error: Sami-Android.apk not found or empty! Running builder..."
            python3 scripts/build_sami_apk.py
          fi

          # Copy to distribution directories
          mkdir -p public data/uploads
          cp Sami-Android.apk public/Sami-Android.apk
          cp Sami-Android.apk data/uploads/sami_update_v16.apk

          echo "========================================================"
          echo "APK Build Completed Successfully!"
          echo "Filename: Sami-Android.apk"
          echo "Size: $(du -h Sami-Android.apk | cut -f1)"
          echo "SHA-256: $(sha256sum Sami-Android.apk | cut -d' ' -f1)"
          echo "========================================================"

      - name: Inspect APK Integrity & Package Info (فحص التوقيع وصلاحية التحديث)
        run: |
          npx tsx -e "
          import fs from 'fs';
          import { inspectApkBuffer } from './src/server/apkInspector.ts';

          async function verify() {
            const buf = fs.readFileSync('Sami-Android.apk');
            const res = await inspectApkBuffer({
              buffer: buf,
              fileName: 'Sami-Android.apk',
              publishedVersionCode: 15
            });
            console.log('APK Inspection Summary:');
            console.log('- Valid:', res.valid);
            console.log('- Application ID:', res.applicationId);
            console.log('- Version Name:', res.versionName);
            console.log('- Version Code:', res.versionCode);
            console.log('- Signing Cert SHA-256:', res.signingCertificate.sha256Fingerprint);
            if (!res.valid) {
              console.error('Validation errors:', res.errors);
              process.exit(1);
            }
          }
          verify().catch(e => { console.error(e); process.exit(1); });
          "

      - name: Upload APK Artifact (رفع الحزمة في ملخص GitHub Actions)
        uses: actions/upload-artifact@v4
        with:
          name: Sami-Android-v1.3.2
          path: Sami-Android.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release (إنشاء ونشر الإصدار الرسمي في GitHub)
        if: (github.event_name == 'workflow_dispatch' && (inputs.create_release == true || inputs.create_release == 'true')) || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: ${{ inputs.release_tag || 'v1.3.2' }}
          name: 'Sami v1.3.2 (تحديث منصة سامي الرسمي)'
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
          files: |
            Sami-Android.apk
          body: |
            ## تحديث تطبيق سامي الرسمي (Sami Trading Challenge Tracker) - الإصدار 1.3.2

            تم إطلاق الإصدار **1.3.2** من تطبيق **Sami** لتتبع تحديات التداول برقم إصدار **16**.

            ### المميزات والتحسينات في هذا الإصدار:
            1. **إصلاح مشكلة الدخول إلى القنوات**:
               - إصلاح مشكلة عدم استجابة القنوات لبعض حسابات المستخدمين من جذورها.
               - مزامنة صلاحيات الانضمام والتحقق الرقمي من هوية المستخدم دون المساس بالأمان أو صلاحيات المدير.
            2. **إظهار التفاعلات وعددها على الرسائل**:
               - إظهار رموز التفاعلات مباشرة أسفل الرسالة مع عدد المستخدمين المتفاعلين لكل رمز.
               - دعم التفاعلات المتعددة والمزامنة الفورية عند إضافة أو تغيير أو إزالة أي تفاعل.
            3. **ترقية إصدار التطبيق وضمان التحديث السلس**:
               - ترقية `versionName` إلى **1.3.2** وترقية `versionCode` إلى **16**.
               - الحفاظ التام على معرّف الحزمة: `com.sami.tradingchallengetracker`.
               - استخدام مفتاح التوقيع الرقمي الأصلي نفسه (`sami-signing-key.p12`) لضمان تثبيت التحديث فوق الإصدار السابق 1.3.1 بدون أي تعارض في الحزمة ودون الحاجة لحذف التطبيق أو فقدان بيانات المستخدمين.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
