name: "Sami Quality and Security CI"

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  validate-and-test:
    name: Code Quality & Security Invariants Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Type Check & Lint Codebase
        run: npm run lint

      - name: Run Sami Channel Access & Security Verification Suite
        run: npx tsx scripts/test_channel_authorization.ts

      - name: Verify APK Signature & Package Metadata
        run: |
          APK_FILE=""
          if [ -f "Sami-Android.apk" ]; then
            APK_FILE="Sami-Android.apk"
          elif [ -f "public/Sami-Android.apk" ]; then
            APK_FILE="public/Sami-Android.apk"
          fi

          if [ -n "$APK_FILE" ]; then
            npx tsx -e "
            import fs from 'fs';
            import { inspectApkBuffer } from './src/server/apkInspector.ts';

            async function check() {
              const buf = fs.readFileSync(process.argv[1]);
              const res = await inspectApkBuffer({ buffer: buf, fileName: 'Sami-Android.apk', publishedVersionCode: 15 });
              if (!res.valid) {
                console.error('Errors:', res.errors);
                process.exit(1);
              }
              console.log('APK verification passed! Version:', res.versionName, 'Code:', res.versionCode);
            }
            check();
            " "$APK_FILE"
          fi
